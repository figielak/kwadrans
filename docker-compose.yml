services:
  games:
    image: ghcr.io/figielak/kwadrans:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: Europe/Warsaw # wyzwanie dnia zmienia się o polskiej północy
    volumes:
      - games-data:/app/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    restart: unless-stopped
    mem_limit: 64m
    depends_on: [games]

volumes:
  games-data:
